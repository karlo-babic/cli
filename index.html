if _C:
    RED = "\033[31m"
    GREEN = "\033[32m"
    YELLOW = "\033[33m"
    BLUE = "\033[34m"
    CYAN = "\033[36m"
    RESET = "\033[0m"
else:
    RED = GREEN = YELLOW = BLUE = CYAN = RESET = ""

def get_python_cmd():
    candidates = ["python3", "python"]
    if os.name == "nt":
        candidates.insert(0, "py")

    for cmd in candidates:
        if shutil.which(cmd):
            return cmd

    return None

def run_script(name, args=None):
    if name not in SCRIPTS:
        err(f"Unknown script: {name}")
        print()
        return

    args = args or []
    script_url = SCRIPTS[name]["url"]

    # Download the script to a temporary file
    with tempfile.NamedTemporaryFile("w+", delete=False, suffix=".py", encoding="utf-8") as tmp:
        try:
            with urllib.request.urlopen(script_url) as response:
                tmp.write(response.read().decode())
            tmp.flush()
        except Exception as e:
            err(f"Failed to fetch script: {e}")
            print()
            return

        # Execute the downloaded script with forwarded arguments
        python_cmd = get_python_cmd()
        if not python_cmd:
            err("No Python interpreter found")
            print()
            return
        cmd = [python_cmd, tmp.name] + args
        
        try:
            # Use Popen instead of run() so we can manage the interrupt signal
            p = subprocess.Popen(cmd)
            p.wait()
        except KeyboardInterrupt:
            # The user pressed Ctrl+C. The child script also received this signal.
            # We must wait a few seconds for the child to finish its cleanup routine.
            try:
                p.wait(timeout=5)
            except subprocess.TimeoutExpired:
                p.terminate() # Force kill if it hangs longer than 5 seconds
            print()
        except Exception as e:
            err(f"Execution failed: {e}")
            print()
        finally:
            # Clean up the downloaded temporary file so they don't pile up
            try:
                os.remove(tmp.name)
            except Exception:
                pass

def print_help():
    print(f"\n{CYAN}Available Scripts:{RESET}")
    for name, info in SCRIPTS.items():
        if info.get("hidden"):
            continue
        print(f"  {GREEN}{name:<8}{RESET} - {info.get('description','')}")
    print(f"\n{CYAN}Interactive Mode Usage:{RESET}")
    print("  Type a script name, 'help [script]', or 'exit'.")
    print(f"\n{CYAN}Direct Execution:{RESET}")
    if os.name == "nt":
        print(f"  {YELLOW}irm {BASE_URL} | python - <script>{RESET}\n")
    else:
        print(f"  {YELLOW}curl -s {BASE_URL} | python - <script>{RESET}\n")

def main():
    if len(sys.argv) > 1:
        script_name = sys.argv[1]
        script_args = sys.argv[2:]
        run_script(script_name, script_args)
        return

    top = "    \u2554" + "\u2550"*38 + "\u2557"
    mid = "    \u2551   Remote Python Script Environment   \u2551"
    bot = "    \u255A" + "\u2550"*38 + "\u255D"
    print(f"\n{CYAN}{top}\n{mid}\n{bot}{RESET}")

    print_help()

    # Reconnect standard input to the terminal if the script was piped (curl | python3)
    # This restores native arrow key support, command history, and line editing.
    if not sys.stdin.isatty():
        try:
            tty_fd = os.open("CON" if os.name == "nt" else "/dev/tty", os.O_RDONLY)
            os.dup2(tty_fd, 0)
            sys.stdin = os.fdopen(0, "r")
            
            # Import readline ONLY AFTER stdin is reconnected to the terminal
            try:
                import readline
            except ImportError:
                pass
        except Exception:
            pass

    while True:
        try:
            inp = input(f"{GREEN}cli>{RESET} ").strip()
            
            if not inp:
                continue

            if inp.lower() in ("exit", "quit"):
                print("\nExiting.\n")
                break

            if inp.lower().startswith("help"):
                parts = shlex.split(inp)
                if len(parts) == 1:
                    print_help()
                else:
                    script_name = parts[1]
                    script_info = SCRIPTS.get(script_name)
                    if not script_info:
                        err(f"No help available for unknown script '{script_name}'")
                        print()
                    else:
                        section(script_name)
                        print(f"{script_info.get('description','')}")
                        if script_info.get("usage"):
                            print(f"\n{YELLOW}Usage:{RESET} {script_info['usage']}")
                        args = script_info.get("args", [])
                        if args:
                            print(f"\n{YELLOW}Arguments:{RESET}")
                            for arg in args:
                                print(f"  {GREEN}{arg.get('name',''):<15}{RESET} : {arg.get('description','')}")
                        print()
                continue

            parts = shlex.split(inp)
            if not parts:
                continue

            script_name, *script_args = parts
            run_script(script_name, script_args)

        except (EOFError, KeyboardInterrupt):
            print("\n\nExiting.\n")
            break

if __name__ == "__main__":
    main()
